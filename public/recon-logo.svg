<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" fill="none">
  <defs>
    <!-- Main 3D Emerald Gradients -->
    <linearGradient id="reconEmeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00b047" />
      <stop offset="35%" stop-color="#009139" />
      <stop offset="100%" stop-color="#00501f" />
    </linearGradient>

    <linearGradient id="reconEmeraldLightFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d655" />
      <stop offset="100%" stop-color="#00943a" />
    </linearGradient>

    <linearGradient id="reconEmeraldDarkFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006b29" />
      <stop offset="100%" stop-color="#003d16" />
    </linearGradient>

    <linearGradient id="reconExpoGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00be4d" />
      <stop offset="100%" stop-color="#007a30" />

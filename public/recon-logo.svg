      <stop offset="0%" stop-color="#ff2828" />
      <stop offset="45%" stop-color="#e01818" />
      <stop offset="100%" stop-color="#9e0a0a" />
    </linearGradient>

    <!-- Swoosh Gradients -->
    <linearGradient id="reconSwooshGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b84c" />
      <stop offset="50%" stop-color="#008836" />
      <stop offset="100%" stop-color="#004d1d" />
    </linearGradient>

    <linearGradient id="reconSwooshRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f02424" />
      <stop offset="60%" stop-color="#cb1616" />
      <stop offset="100%" stop-color="#8a0808" />
    </linearGradient>
  </defs>


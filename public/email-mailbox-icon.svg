<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="avatarBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#012219" />
      <stop offset="50%" stop-color="#023b2c" />
      <stop offset="100%" stop-color="#011913" />
    </linearGradient>

    <linearGradient id="goldRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <filter id="avatarShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Circular Container with Gold Border -->
  <rect width="512" height="512" rx="128" fill="url(#avatarBgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="url(#goldRimGrad)" stroke-width="8" opacity="0.9" fill="none" />

  <!-- Inner Architectural Emblem Group -->
  <g transform="translate(68, 80) scale(0.76)" filter="url(#avatarShadow)">
    <!-- Skyscraper & House Structure -->
    <path d="M15 315 L15 150 L85 105 L135 130 L135 315 Z" fill="#00501f" />
    <path d="M85 105 L135 130 L135 315 L85 315 Z" fill="#00943a" />
    <path d="M15 150 L85 105 L65 140 L15 170 Z" fill="#00e65b" opacity="0.9" />

    <path d="M190 260 L190 60 L275 15 L275 290 Z" fill="#005421" />
    <path d="M275 15 L320 50 L320 290 L275 290 Z" fill="#00943a" />
    <path d="M225 80 L275 15 L275 290 L230 290 Z" fill="#00ff66" opacity="0.6" />

    <!-- Red Brick Chimney -->
    <path d="M115 280 L115 80 L195 80 L195 280 Z" fill="#d31e1e" />
    <g stroke="#ffffff" stroke-width="2.8" opacity="0.95">
      <line x1="115" y1="102" x2="195" y2="102" />
      <line x1="115" y1="124" x2="195" y2="124" />
      <line x1="115" y1="146" x2="195" y2="146" />
      <line x1="115" y1="168" x2="195" y2="168" />
      <line x1="115" y1="190" x2="195" y2="190" />
      <line x1="115" y1="212" x2="195" y2="212" />
      <line x1="115" y1="234" x2="195" y2="234" />
      <line x1="142" y1="80" x2="142" y2="102" />
      <line x1="168" y1="80" x2="168" y2="102" />
      <line x1="128" y1="102" x2="128" y2="124" />
      <line x1="155" y1="102" x2="155" y2="124" />
      <line x1="182" y1="102" x2="182" y2="124" />
    </g>

    <!-- House Gable -->
    <path d="M25 330 L205 195 L340 315 L318 328 L205 225 L45 340 Z" fill="#ffffff" />
    <path d="M10 338 L205 180 L355 315 L330 335 L205 212 L35 352 Z" fill="#ea2020" />
    <path d="M55 338 L205 215 L305 320 L305 338 L55 338 Z" fill="#ffffff" />

    <!-- 4-Pane Window -->
    <g transform="translate(175, 238)">
      <rect x="0" y="0" width="18" height="18" fill="#008033" rx="2" />
      <rect x="23" y="0" width="18" height="18" fill="#008033" rx="2" />
      <rect x="0" y="23" width="18" height="18" fill="#008033" rx="2" />
      <rect x="23" y="23" width="18" height="18" fill="#008033" rx="2" />
    </g>

    <!-- RECON Bold Typography -->
    <path d="M340 70 H415 C455 70 480 92 480 125 C480 152 460 172 428 178 L490 255 H432 L382 188 H372 V255 H340 Z M372 98 V160 H410 C432 160 448 148 448 130 C448 112 432 98 410 98 Z" fill="#ffffff" />
    <path d="M495 70 H580 V102 H530 V142 H572 V174 H530 V222 H585 V255 H495 Z" fill="#ffffff" />
  </g>

  <!-- Bottom Brand Text -->
  <text x="256" y="415" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#fbbf24" letter-spacing="4">RECON EXPO</text>
  <text x="256" y="455" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" fill="#a7f3d0" letter-spacing="3">ABUJA • 2026</text>
</svg>
